
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazca Saarotun - 262505015 - Kalkulator Aritmatika Modulo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ddd;
            font-weight: bold;
        }

        .tabs button.active {
            background: #243b55;
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .calculate {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .calculate:hover {
            background: #365b80;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #edf4ff;
            border-left: 5px solid #243b55;
            border-radius: 8px;
            display: none;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .result strong {
            color: #243b55;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Kalkulator Modulo</h1>
    <p class="subtitle">Kalkulator Aritmatika Modular</p>

    <div class="tabs">
        <button class="active" onclick="showTab('basic', this)">
            Modulo Basic
        </button>

        <button onclick="showTab('congruence', this)">
            Kongruensi
        </button>
    </div>

    <!-- MODULO BASIC -->
    <div id="basic" class="section active">

        <h3>Kalkulator Modulo Basic</h3>

        <label>Bilangan Pertama (a)</label>
        <input type="number" id="a" placeholder="Masukkan bilangan pertama">

        <label>Operasi Aritmatika</label>
        <select id="operator">
            <option value="+">Penjumlahan (+)</option>
            <option value="-">Pengurangan (-)</option>
            <option value="*">Perkalian (*)</option>
            <option value="^">Perpangkatan (^)</option>
        </select>

        <label>Bilangan Kedua (b)</label>
        <input type="number" id="b" placeholder="Masukkan bilangan kedua">

        <label>Modulus (n)</label>
        <input type="number" id="n" placeholder="Masukkan modulus">

        <button class="calculate" onclick="calculateModulo()">
            Hitung Modulo
        </button>

        <div class="result" id="basicResult"></div>

    </div>

    <!-- PENGECEKAN KONGRUENSI -->
    <div id="congruence" class="section">

        <h3>Pengecekan Kongruensi</h3>

        <label>Bilangan Pertama (a)</label>
        <input type="number" id="x" placeholder="Masukkan bilangan a">

        <label>Bilangan Kedua (b)</label>
        <input type="number" id="y" placeholder="Masukkan bilangan b">

        <label>Modulus (n)</label>
        <input type="number" id="mod" placeholder="Masukkan modulus">

        <button class="calculate" onclick="checkCongruence()">
            Cek Kongruensi
        </button>

        <div class="result" id="congruenceResult"></div>

    </div>

    <div class="footer">
        Kalkulator Aritmatika Modulo
    </div>

</div>

<script>

    // Fungsi untuk berpindah tab
    function showTab(tab, button) {
        document.querySelectorAll('.section').forEach(s => {
            s.classList.remove('active');
        });

        document.querySelectorAll('.tabs button').forEach(b => {
            b.classList.remove('active');
        });

        document.getElementById(tab).classList.add('active');
        button.classList.add('active');
    }

    // Fungsi modulo agar hasil selalu non-negatif
    function modulo(a, n) {
        return ((a % n) + n) % n;
    }

    // Kalkulator modulo basic
    function calculateModulo() {
        const a = Number(document.getElementById('a').value);
        const b = Number(document.getElementById('b').value);
        const n = Number(document.getElementById('n').value);
        const op = document.getElementById('operator').value;

        const resultBox = document.getElementById('basicResult');

        if (
            document.getElementById('a').value === '' ||
            document.getElementById('b').value === '' ||
            document.getElementById('n').value === ''
        ) {
            alert("Semua input harus diisi!");
            return;
        }

        if (![a, b, n].every(Number.isSafeInteger)) {
            alert("Masukkan bilangan bulat yang valid!");
            return;
        }

        if (n <= 0) {
            alert("Modulus harus lebih besar dari 0!");
            return;
        }

        let operasi;
        let hasil;

        switch (op) {
            case '+':
                operasi = a + b;
                break;

            case '-':
                operasi = a - b;
                break;

            case '*':
                operasi = a * b;
                break;

            case '^':
                if (b < 0) {
                    alert("Pangkat tidak boleh negatif!");
                    return;
                }

                // Perhitungan perpangkatan modular
                let base = modulo(a, n);
                let exponent = b;
                hasil = 1;

                while (exponent > 0) {
                    if (exponent % 2 === 1) {
                        hasil = modulo(hasil * base, n);
                    }

                    base = modulo(base * base, n);
                    exponent = Math.floor(exponent / 2);
                }

                break;
        }

        if (op !== '^') {
            hasil = modulo(operasi, n);
        }

        resultBox.style.display = 'block';

        resultBox.innerHTML = `
            <strong>Hasil Perhitungan:</strong><br>
            ${a} ${op} ${b} (mod ${n})<br>
            <strong>Hasil:</strong> ${hasil}
        `;
    }

    // Fungsi pengecekan kongruensi
    function checkCongruence() {
        const a = Number(document.getElementById('x').value);
        const b = Number(document.getElementById('y').value);
        const n = Number(document.getElementById('mod').value);

        const resultBox =
            document.getElementById('congruenceResult');

        if (
            document.getElementById('x').value === '' ||
            document.getElementById('y').value === '' ||
            document.getElementById('mod').value === ''
        ) {
            alert("Semua input harus diisi!");
            return;
        }

        if (![a, b, n].every(Number.isSafeInteger)) {
            alert("Masukkan bilangan bulat yang valid!");
            return;
        }

        if (n <= 0) {
            alert("Modulus harus lebih besar dari 0!");
            return;
        }

        const sisaA = modulo(a, n);
        const sisaB = modulo(b, n);

        const selisih = a - b;
        const kongruen = sisaA === sisaB;

        resultBox.style.display = 'block';

        resultBox.innerHTML = `
            <strong>Hasil Pengecekan:</strong><br><br>

            a = ${a}<br>
            b = ${b}<br>
            Modulus = ${n}<br><br>

            Sisa ${a} mod ${n} = ${sisaA}<br>
            Sisa ${b} mod ${n} = ${sisaB}<br><br>

            Selisih a - b = ${selisih}<br><br>

            <strong>
                ${kongruen
                    ? "✓ KONGRUEN"
                    : "✗ TIDAK KONGRUEN"}
            </strong><br>

            ${kongruen
                ? `${a} ≡ ${b} (mod ${n})`
                : `${a} ≢ ${b} (mod ${n})`}
        `;
    }

</script>

</body>
</html>
