
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazca Saarotun - 262505015 - Kalkulator Aritmatika Modulo</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 25px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
}

.container {
    background: white;
    width: 100%;
    max-width: 550px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px #0005;
}

h1 {
    text-align: center;
    color: #243b55;
}

.subtitle {
    text-align: center;
    color: gray;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tabs button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #ddd;
    font-weight: bold;
}

.tabs button.active {
    background: #243b55;
    color: white;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

h3 {
    color: #243b55;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.calculate {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    border: none;
    border-radius: 8px;
    background: #243b55;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.calculate:hover {
    background: #365b80;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 8px;
    background: #edf4ff;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.status {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.benar {
    color: #087a35;
    background: #d8f8e3;
    border: 2px solid #20a456;
}

.salah {
    color: #c62828;
    background: #ffe0e0;
    border: 2px solid #e53935;
}

.footer {
    text-align: center;
    color: gray;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>KALKULATOR MODULO</h1>
<p class="subtitle">Aritmatika Modular dan Pengecekan Kongruensi</p>

<div class="tabs">
    <button class="active" onclick="showTab('basic',this)">
        Modulo Basic
    </button>

    <button onclick="showTab('congruence',this)">
        Cek Kongruensi
    </button>
</div>

<!-- MODULO BASIC -->
<div id="basic" class="section active">

<h3>Kalkulator Modulo Basic</h3>

<label>Bilangan Pertama (a)</label>
<input type="number" id="a" placeholder="Masukkan bilangan a">

<label>Operasi</label>
<select id="operator">
    <option value="+">Penjumlahan (+)</option>
    <option value="-">Pengurangan (-)</option>
    <option value="*">Perkalian (×)</option>
    <option value="^">Perpangkatan (^)</option>
</select>

<label>Bilangan Kedua (b)</label>
<input type="number" id="b" placeholder="Masukkan bilangan b">

<label>Modulus (n)</label>
<input type="number" id="n" placeholder="Masukkan modulus">

<button class="calculate" onclick="calculateModulo()">
    HITUNG
</button>

<div class="result" id="basicResult"></div>

</div>

<!-- CEK KONGRUENSI -->
<div id="congruence" class="section">

<h3>Pengecekan Kongruensi</h3>

<label>Bilangan Pertama (a)</label>
<input type="number" id="x" placeholder="Masukkan bilangan a">

<label>Bilangan Kedua (b)</label>
<input type="number" id="y" placeholder="Masukkan bilangan b">

<label>Modulus (n)</label>
<input type="number" id="mod" placeholder="Masukkan modulus">

<button class="calculate" onclick="checkCongruence()">
    CEK KONGRUENSI
</button>

<div class="result" id="congruenceResult"></div>

</div>

<div class="footer">
    Kalkulator Aritmatika Modular
</div>

</div>

<script>

// PINDAH MENU
function showTab(tab, button) {
    document.querySelectorAll('.section').forEach(s => {
        s.classList.remove('active');
    });

    document.querySelectorAll('.tabs button').forEach(b => {
        b.classList.remove('active');
    });

    document.getElementById(tab).classList.add('active');
    button.classList.add('active');
}

// FUNGSI MODULO
function modulo(a,n) {
    return ((a % n) + n) % n;
}

// VALIDASI BILANGAN
function getInteger(id) {
    const value = document.getElementById(id).value;

    if (value.trim() === '') {
        throw new Error("Semua kolom harus diisi!");
    }

    const number = Number(value);

    if (!Number.isSafeInteger(number)) {
        throw new Error("Masukkan bilangan bulat yang valid!");
    }

    return number;
}

// KALKULATOR MODULO BASIC
function calculateModulo() {
    const resultBox = document.getElementById('basicResult');

    try {
        const a = getInteger('a');
        const b = getInteger('b');
        const n = getInteger('n');

        const op = document.getElementById('operator').value;

        if (n <= 0) {
            throw new Error("Modulus harus lebih besar dari 0!");
        }

        let hasil;
        let simbol = op;

        if (op === '+') {
            hasil = modulo(a + b, n);
        }
        else if (op === '-') {
            hasil = modulo(a - b, n);
        }
        else if (op === '*') {
            hasil = modulo(a * b, n);
        }
        else if (op === '^') {
            if (b < 0) {
                throw new Error("Pangkat tidak boleh negatif!");
            }

            let base = modulo(a, n);
            let pangkat = b;
            hasil = 1 % n;

            while (pangkat > 0) {
                if (pangkat % 2 === 1) {
                    hasil = modulo(hasil * base, n);
                }

                base = modulo(base * base, n);
                pangkat = Math.floor(pangkat / 2);
            }
        }

        resultBox.style.display = 'block';

        resultBox.innerHTML = `
            <strong>HASIL PERHITUNGAN</strong><br><br>
            (${a} ${simbol} ${b}) mod ${n}<br>
            <hr>
            <strong>Hasil Akhir = ${hasil}</strong>
        `;

    } catch (error) {
        alert(error.message);
    }
}

// PENGECEKAN KONGRUENSI
function checkCongruence() {
    const resultBox =
        document.getElementById('congruenceResult');

    try {
        const a = getInteger('x');
        const b = getInteger('y');
        const n = getInteger('mod');

        if (n <= 0) {
            throw new Error("Modulus harus lebih besar dari 0!");
        }

        const sisaA = modulo(a,n);
        const sisaB = modulo(b,n);

        const selisih = a-b;

        const benar = sisaA === sisaB;

        resultBox.style.display = 'block';

        resultBox.innerHTML = `
            <strong>HASIL PENGECEKAN KONGRUENSI</strong>
            <br><br>

            a = ${a}<br>
            b = ${b}<br>
            n = ${n}<br><br>

            ${a} mod ${n} = ${sisaA}<br>
            ${b} mod ${n} = ${sisaB}<br><br>

            Selisih = ${a} - ${b} = ${selisih}<br><br>

            <strong>
            ${a} ${benar ? '≡' : '≢'} ${b} (mod ${n})
            </strong>

            <div class="status ${benar ? 'benar' : 'salah'}">
                ${benar ? '✓ BENAR' : '✗ SALAH'}
            </div>

            <p style="text-align:center">
                ${benar
                ? 'Kedua bilangan KONGRUEN karena memiliki sisa pembagian yang sama.'
                : 'Kedua bilangan TIDAK KONGRUEN karena memiliki sisa pembagian yang berbeda.'}
            </p>
        `;

    } catch (error) {
        alert(error.message);
    }
}

</script>

</body>
</html>
